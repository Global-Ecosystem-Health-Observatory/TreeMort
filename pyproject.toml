[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TreeMort"
version = "0.1.0"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["treemort*"]

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py38', 'py39']
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | migrations
  | build
  | dist
)/
'''